name: build-debug

# Manual debug build for validating contribution branches. Fork-only: dispatch with a branch name.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or ref to build
        required: true
        default: main
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # Without ANDROID_USER_HOME, Gradle on GitHub's runners signs with a debug key of its own instead of this one.
      - name: Build
        run: |
          export ANDROID_USER_HOME="$HOME/.android"
          mkdir -p "$ANDROID_USER_HOME"
          cd android && ./gradlew --no-daemon assembleDebug
