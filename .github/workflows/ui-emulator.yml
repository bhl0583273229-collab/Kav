name: Emulator UI check
# Fork-only verification aid, not part of the app: builds a branch and runs its debug APK on an emulator, opens the
# departures widget's configuration screen, and keeps screenshots and the UI dump as artifacts.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or ref to build and run'
        required: true
        default: main
jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Build debug APK
        run: |
          export ANDROID_USER_HOME=$HOME/.android
          mkdir -p "$ANDROID_USER_HOME"
          cd android && ./gradlew --no-daemon assembleDebug
      - name: Enable KVM (the runner's /dev/kvm needs the udev rule to be usable)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the widget's configuration screen on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_6
          script: ls -la android/app/build/outputs/apk/debug/ && adb install -r $(ls android/app/build/outputs/apk/debug/*.apk | head -1) && printf '%s' '<?xml version="1.0" encoding="utf-8" standalone="yes" ?><map><string name="savedStops">["34011/","34012/"]</string></map>' > kav.xml && adb push kav.xml /data/local/tmp/kav.xml && adb shell run-as uk.noammm.kav mkdir -p /data/data/uk.noammm.kav/shared_prefs && adb shell run-as uk.noammm.kav cp /data/local/tmp/kav.xml /data/data/uk.noammm.kav/shared_prefs/kav.xml && adb shell am start -n uk.noammm.kav/.DeparturesWidgetConfigActivity --ei appWidgetId 42 && sleep 6 && adb shell screencap -p /sdcard/config-picker.png && adb shell uiautomator dump /sdcard/picker-ui.xml && adb pull /sdcard/config-picker.png config-picker.png && adb pull /sdcard/picker-ui.xml picker-ui.xml && XY=$(python3 -c "import re; s=open('picker-ui.xml').read(); m=re.search(r'text=\"34011\"[^>]*bounds=\"\\[(\\d+),(\\d+)\\]\\[(\\d+),(\\d+)\\]\"', s); print((int(m.group(1))+int(m.group(3)))//2, (int(m.group(2))+int(m.group(4)))//2)") && adb shell input tap $XY && sleep 2 && (adb shell run-as uk.noammm.kav cat /data/data/uk.noammm.kav/shared_prefs/kav.xml > kav-after.xml || true) && cat kav-after.xml && adb shell am start -n uk.noammm.kav/.MainActivity && sleep 8 && adb shell screencap -p /sdcard/main.png && adb pull /sdcard/main.png main.png && (adb logcat -d | grep -i "FATAL\|AndroidRuntime" | head -20 > logcat-fatal.txt || true) && echo UI-CHECK-DONE
      - uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: |
            config-picker.png
            picker-ui.xml
            kav-after.xml
            main.png
            logcat-fatal.txt
